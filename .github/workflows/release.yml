name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend & Verify Types
        run: npm run build

      - name: Compile Release Binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --features custom-protocol

      - name: Package Release Artifacts
        shell: powershell
        run: |
          Copy-Item -Path "src-tauri/target/release/autodarkmode.exe" -Destination "AutoDarkMode.exe"
          $hash = (Get-FileHash -Path "AutoDarkMode.exe" -Algorithm SHA256).Hash
          Set-Content -Path "AutoDarkMode.exe.sha256" -Value "$hash *AutoDarkMode.exe"
          Write-Host "Artifact generated: AutoDarkMode.exe (SHA-256: $hash)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoDarkMode-Windows-x64
          path: |
            AutoDarkMode.exe
            AutoDarkMode.exe.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            AutoDarkMode.exe
            AutoDarkMode.exe.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
